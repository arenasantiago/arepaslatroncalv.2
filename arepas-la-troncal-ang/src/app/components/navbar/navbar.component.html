<header class="sticky top-0 z-40 bg-marca shadow-md">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-2" aria-label="Principal">
    <a routerLink="/inicio" class="flex items-center gap-3" aria-label="Arepas La Troncal, ir al inicio">
      <img src="assets/img/logo-arepa.webp" alt="" width="64" height="64" class="h-14 w-14 md:h-16 md:w-16" />
      <span class="hidden text-lg font-bold text-white sm:inline">Arepas La Troncal</span>
    </a>

    <ul class="hidden items-center gap-2 text-lg font-semibold text-white md:flex">
      @for (enlace of enlaces; track enlace.ruta) {
        <li>
          <a [routerLink]="enlace.ruta"
             routerLinkActive="bg-white/20"
             ariaCurrentWhenActive="page"
             class="rounded-full px-4 py-2 transition-colors hover:bg-white/10">{{ enlace.texto }}</a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-2">
      <a routerLink="/carrito"
         class="relative flex items-center gap-2 rounded-full bg-white/10 px-3 py-2 text-white transition-colors hover:bg-white/20"
         [attr.aria-label]="carrito.cantidadTotal() ? 'Ver pedido, ' + carrito.cantidadTotal() + ' unidades' : 'Ver pedido, vacío'">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13 5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="9" cy="20" r="1.5" stroke-width="2" /><circle cx="17" cy="20" r="1.5" stroke-width="2" />
        </svg>
        <span class="hidden font-semibold sm:inline">Pedido</span>
        @if (carrito.cantidadTotal() > 0) {
          <span data-prueba="contador-carrito"
                class="absolute -right-2 -top-2 flex h-6 min-w-6 items-center justify-center rounded-full bg-yellow-400 px-1 text-xs font-bold text-carbon">
            {{ carrito.cantidadTotal() }}
          </span>
        }
      </a>

      <button type="button"
              (click)="alternarMenu()"
              class="rounded-full p-2 text-3xl leading-none text-white md:hidden"
              [attr.aria-expanded]="menuAbierto()"
              aria-controls="menu-movil"
              [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'">
        <span aria-hidden="true">{{ menuAbierto() ? '✕' : '☰' }}</span>
      </button>
    </div>
  </nav>

  <!-- Menu movil -->
  <div id="menu-movil"
       class="fixed right-0 top-0 z-50 h-full w-64 transform bg-marca text-white shadow-lg transition-transform duration-300 ease-in-out md:hidden"
       [class.translate-x-full]="!menuAbierto()"
       [class.invisible]="!menuAbierto()">
    <ul class="flex flex-col gap-2 p-6 pt-20 text-xl font-semibold">
      @for (enlace of enlaces; track enlace.ruta) {
        <li>
          <a [routerLink]="enlace.ruta" routerLinkActive="bg-white/20" (click)="cerrarMenu()"
             class="block rounded-lg px-3 py-2 hover:bg-white/10">{{ enlace.texto }}</a>
        </li>
      }
      <li>
        <a routerLink="/carrito" (click)="cerrarMenu()" class="mt-4 block rounded-full bg-acento px-4 py-3 text-center hover:bg-acento-oscuro">
          Ver pedido
        </a>
      </li>
    </ul>
  </div>
  @if (menuAbierto()) {
    <div class="fixed inset-0 z-40 bg-black/50 md:hidden" (click)="cerrarMenu()" aria-hidden="true"></div>
  }
</header>
